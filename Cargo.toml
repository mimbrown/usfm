[workspace]

members = [
  "tests",
  "usfm_ast",
  "usfm_parser",
  "usfm_style",
]
# `wip/` is parked outside the workspace (ticket 01); M6 rebuilds the language
# server in `apps/`.
exclude = ["wip"]
resolver = "2"

[workspace.dependencies]
bitflags = "2.9.0"
notify = "8.1.0"
regex = "1.11.1"
regex-automata = "0.4.9"
serde = "1.0.210"
serde_json = "1.0"
xml-rs = "0.8.26"
