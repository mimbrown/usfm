[workspace]

members = [
  "apps/usfm_cli",
  "apps/usfm_language_server",
  "crates/usfm",
  "crates/usfm_ast",
  "crates/usfm_codegen",
  "crates/usfm_diagnostics",
  "crates/usfm_html",
  "crates/usfm_json",
  "crates/usfm_parser",
  "crates/usfm_pipeline",
  "crates/usfm_semantic",
  "crates/usfm_span",
  "crates/usfm_style",
  "crates/usfm_usx",
  "tasks/benchmark",
  "tasks/conformance",
]
# `tasks/fuzz` is a cargo-fuzz crate: it needs nightly and
# `-Zsanitizer=address`, so it keeps its own workspace and lockfile and is run
# on demand (`tasks/fuzz/README.md`), not by the gate.
exclude = ["tasks/fuzz"]
resolver = "2"

[workspace.dependencies]
bitflags = "2.9.0"
# The CLI's argument parsing (ticket 15). `derive` is the only feature added to
# the defaults: the command is a struct, so the flags and the help text cannot
# drift apart.
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.1.0"
regex = "1.11.1"
regex-automata = "0.4.9"
serde = "1.0.210"
serde_json = "1.0"
# The language server's runtime (ticket 30). `tower-lsp-server` is the maintained fork of
# `tower-lsp` and carries its own `lsp_types`. `apps/usfm_language_server` is
# the only async crate in the workspace, so tokio is named for it alone and
# with the features an stdio LSP loop needs rather than `full`.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tower-lsp-server = "0.23.0"
xml-rs = "0.8.26"
