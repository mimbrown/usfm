[workspace]

members = [
  "apps/usfm_cli",
  "tasks/benchmark",
  "tests",
  "usfm_ast",
  "usfm_diagnostics",
  "usfm_html",
  "usfm_parser",
  "usfm_pipeline",
  "usfm_span",
  "usfm_style",
  "usfm_usx",
]
# `wip/` is parked outside the workspace (ticket 01); M6 rebuilds the language
# server in `apps/`. `tasks/fuzz` is a cargo-fuzz crate: it needs nightly and
# `-Zsanitizer=address`, so it keeps its own workspace and lockfile and is run
# on demand (`tasks/fuzz/README.md`), not by the gate.
exclude = ["wip", "tasks/fuzz"]
resolver = "2"

[workspace.dependencies]
bitflags = "2.9.0"
# The CLI's argument parsing (ticket 15). `derive` is the only feature added to
# the defaults: the command is a struct, so the flags and the help text cannot
# drift apart.
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.1.0"
regex = "1.11.1"
regex-automata = "0.4.9"
serde = "1.0.210"
serde_json = "1.0"
xml-rs = "0.8.26"
