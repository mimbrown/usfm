[workspace]

members = [
  "data_layer",
  "tests",
  "usfm_language_server",
  "usfm_ast",
  "usfm_parser",
  "usfm_style",
]
resolver = "2"

[workspace.dependencies]
bitflags = "2.9.0"
notify = "8.1.0"
regex = "1.11.1"
regex-automata = "0.4.9"
ropey = "1.6.1"
rusqlite = { version = "0.33.0", features = ["bundled"] }
rusqlite_regex = "0.3.0"
serde = "1.0.210"
serde_json = "1.0"
tokio = "1.40.0"
tower-lsp-server = "0.22.0"
unic = "0.9.0"
xml-rs = "0.8.26"
