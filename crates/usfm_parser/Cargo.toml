[package]
name = "usfm_parser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A USFM parser that never fails: it recovers and reports diagnostics"
repository.workspace = true
# Snapshots of third-party test inputs (tcdocs, CC BY 4.0; machine.py, MIT)
# stay out of the published crate; their tests need the workspace anyway.
exclude = ["tests/snapshots/tcdocs__*", "tests/snapshots/recovery__machine_py_*"]

# A library, and only a library, since ticket 15 moved the binary to
# `apps/usfm_cli`. The dependency list below is M3's exit criterion from
# `.scratch/oxc-layout/spec.md`: span, style, ast and diagnostics, nothing
# else. `usfm_span` is not named directly because `usfm_ast` re-exports it,
# which is how `usfm_parser::lexer::span` resolves.
[dependencies]
usfm_ast = { version = "0.1.0", path = "../usfm_ast" }
# `Diagnostic`, `Code`, `Severity`, `ParseResult`, re-exported as
# `usfm_parser::diagnostics` (ticket 12).
usfm_diagnostics = { version = "0.1.0", path = "../usfm_diagnostics" }
usfm_style = { version = "0.1.0", path = "../usfm_style" }

[features]
# Exposes UniquePromise::new_for_tests_and_benchmarks.
benchmarking = []
# Exposes `span_check`, the span invariants that `tests/spans.rs` and the fuzz
# targets in `tasks/fuzz` both assert.
testing = []

[dev-dependencies]
insta = "1"
# Self dev-dependency (a cycle cargo allows) so the integration tests link the
# library with `testing` on and can call `usfm_parser::span_check`. The default
# build, and every other crate's build, is unaffected.
usfm_parser = { path = ".", features = ["testing"] }
# `tests/usx_text.rs` and the `test_usx` unit test compare the parse against
# USX. A dev-dependency only: the library itself writes no output, and
# `usfm_usx` does not depend on this crate, so nothing here is circular.
usfm_usx = { path = "../usfm_usx" }
