[package]
name = "usfm"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The facade of `docs/adr/0001-oxc-style-crate-layout.md`: one crate to depend
# on. It re-exports the layers under short names and adds the calls most
# consumers want (`parse`, `parse_with`, and `parse_usx`, `parse_usx_with`
# behind `usx`). The crates under `crates/` keep
# depending on each other directly — the facade is for `apps/` and `tasks/`,
# which is why nothing here depends on it in turn.
[dependencies]
usfm_ast = { path = "../usfm_ast" }
usfm_diagnostics = { path = "../usfm_diagnostics" }
usfm_parser = { path = "../usfm_parser" }
# The semantic pass, with no feature of its own: `parse` is the parser plus
# these checks, so it is part of parsing here rather than an optional output.
usfm_semantic = { path = "../usfm_semantic" }
usfm_span = { path = "../usfm_span" }
usfm_style = { path = "../usfm_style" }
# The fixes for what those two report, with no feature either: it depends on
# nothing the parser-only build does not already have.
usfm_fix = { path = "../usfm_fix" }
# `usfm.toml`, with no feature: every tool that reports diagnostics reads it.
usfm_config = { path = "../usfm_config" }

# The output and pipeline crates, each behind the feature named after it. All
# five are on by default, so `usfm = { path = "…" }` is the whole toolchain and
# `default-features = false` is a parser-only build.
usfm_codegen = { path = "../usfm_codegen", optional = true }
usfm_html = { path = "../usfm_html", optional = true }
usfm_json = { path = "../usfm_json", optional = true }
usfm_pipeline = { path = "../usfm_pipeline", optional = true }
usfm_usx = { path = "../usfm_usx", optional = true }
# An input, not an output: a Paratext project folder (ticket 53).
usfm_paratext = { path = "../usfm_paratext", optional = true }

[features]
default = ["usx", "html", "json", "codegen", "pipeline", "paratext"]
usx = ["dep:usfm_usx"]
html = ["dep:usfm_html"]
json = ["dep:usfm_json"]
paratext = ["dep:usfm_paratext"]
codegen = ["dep:usfm_codegen"]
# The pipeline dispatches to all four writers, so it pulls them in.
pipeline = ["dep:usfm_pipeline", "usx", "html", "json", "codegen"]

# Forwarded to `usfm_parser`, off by default like the features they forward to.
# `tasks/benchmark` needs `UniquePromise` to build a `Lexer` for the `lex`
# group; `tasks/fuzz` needs `span_check`, and `usfm_usx::testing` when `usx` is
# on (ticket 49), which the `?` leaves off when it is not.
benchmarking = ["usfm_parser/benchmarking"]
testing = ["usfm_parser/testing", "usfm_usx?/testing"]
