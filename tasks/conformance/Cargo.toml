[package]
name = "usfm_tests"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# The USX tree, its reader and the serializer the harness compares against the
# reference files (ticket 13), reached through the facade (ticket 17).
# `codegen` is the round-trip step of `--roundtrip` (ticket 27); the rest of
# the harness only needs `usx`.
usfm = { path = "../../crates/usfm", default-features = false, features = [
  "usx",
  "codegen",
] }
xml-rs = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
diffy = "0.5.2"

[dev-dependencies]
walkdir = "2"
