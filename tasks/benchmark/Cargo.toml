[package]
name = "usfm_benchmark"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The facade (ticket 17). `usfm::usx`, `usfm::html` and `usfm::json` are the
# three writers the `parse_usx`, `parse_html` and `parse_json` groups measure;
# `pipeline` is off because nothing here renders through it, and `benchmarking`
# forwards to `usfm_parser` for the `UniquePromise` the `lex` group needs to
# build a `Lexer` directly.
usfm = { path = "../../crates/usfm", default-features = false, features = [
  "usx",
  "html",
  "json",
  "benchmarking",
] }

[dev-dependencies]
# `html_reports` is off: the benches are run on demand and read from stdout,
# and the plotters backend is a large dependency that measures nothing.
criterion = { version = "0.6.0", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "corpus"
harness = false
