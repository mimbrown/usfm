[package]
name = "usfm_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the root workspace: the targets need nightly and
# `-Zsanitizer=address`, which the pinned 1.98.0 toolchain the rest of the
# workspace builds with does not have. The root `Cargo.toml` excludes this
# directory and this table stops cargo attaching the crate to it anyway.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# The facade (ticket 17). `usfm::usx`, `usfm::html` and `usfm::codegen` are the
# three writers the targets check; `testing` forwards to `usfm_parser` for
# `span_check`, the span invariants the targets assert. JSON and pipeline stay
# off: no target uses them, and every dependency here is also a dependency of
# the sanitizer build.
usfm = { path = "../../crates/usfm", default-features = false, features = [
  "usx",
  "html",
  "codegen",
  "testing",
] }
xml-rs = "0.8.26"

[[bin]]
name = "parse_lossy"
path = "fuzz_targets/parse_lossy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_utf8"
path = "fuzz_targets/parse_utf8.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_html"
path = "fuzz_targets/parse_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
