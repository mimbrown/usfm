[package]
name = "usfm_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The binary that used to be `usfm_parser/src/main.rs` (ticket 15). It is the
# only crate in the workspace that reads arguments, touches the filesystem or
# watches it; everything it does to a document is a call into `usfm_pipeline`.
[[bin]]
name = "usfm"
path = "src/main.rs"
# The binary is called `usfm` and so is the facade library (ticket 17), and
# rustdoc writes both to `target/doc/usfm/` (rust-lang/cargo#6313). The library
# is the one a caller reads; this binary's docs are its `--help`, so it is left
# out of `cargo doc` rather than overwriting the facade's page.
doc = false

[dependencies]
clap = { workspace = true }
# Watch mode. The dependency moved here with the binary; `usfm_parser` no
# longer has it.
notify = { workspace = true }
# The facade, and the only usfm crate an application names (ticket 17): it
# carries `usfm::ast::Document`, `usfm::diagnostics` for `--diagnostics` and
# `--strict`, `usfm::parser`, `usfm::span::LineIndex`, `usfm::style` for a
# `--stylesheet` file, `usfm::pipeline` for every transform, and
# `usfm::usx` for what `tests/cli.rs` compares the binary's output against.
# Default features: the CLI can write every format.
usfm = { path = "../../crates/usfm" }
