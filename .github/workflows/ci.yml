name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Never write new insta snapshots in CI; a missing snapshot is a failure.
  INSTA_UPDATE: "no"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Toolchain comes from rust-toolchain.toml.
      - run: rustup show active-toolchain

      # Miri needs nightly, and only Miri does: rust-toolchain.toml stays
      # pinned at 1.98.0, and `scripts/miri.sh` asks for `+nightly` explicitly.
      # `miri setup` builds the Miri sysroot once, outside the timed gate step.
      - name: Install nightly Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly miri setup

      - uses: Swatinem/rust-cache@v2

      # The same script agents run before pushing.
      - name: Gate
        run: scripts/gate.sh
